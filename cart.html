<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Shopping Store</title>
 <!-- bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- google awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <!-- style css -->
  <link rel="stylesheet" href="main.css">
  <!-- swiper css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!--google fonts-->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fredoka:wght@300..700&family=REM:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">    
</head>
<body >
    <nav class="navbar navbar-expand-lg custom-navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">BRAND</span></a>
            <div class="ms-auto d-flex align-items-center">
                <a href="cart.html" class="nav-icon-link position-relative">
                    <i class="fa-solid fa-bag-shopping fs-4 text-white"></i>
                    <span id="cart-count" class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="cart-header py-5 mb-4">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-2">
                    <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none fw-bolder">Home</a></li>
                    <li class="breadcrumb-item active">Shopping Cart</li>
                </ol>
            </nav>
            <h1 class="fw-bold m-0">Your Shopping Cart</h1>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-4">
            <div class="col-lg-8">
                <div id="cart-items-container">
                    </div>
            </div>

            <div class="col-lg-4">
                <div class="summary-box shadow-sm border-0 p-4 sticky-top" style="top: 100px;">
                    <h4 class="fw-bold mb-4">Order Summary</h4>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Subtotal</span>
                        <span id="total-items-qty" class="fw-bold">0 Items</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Shipping</span>
                        <span class="text-success fw-bold">Free</span>
                    </div>
                    <hr class="my-4">
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold">Total</span>
                        <span id="total-price-amount" class="fs-4 fw-bold text-primary">$0.00</span>
                    </div>
                    <button class="btn button btn-lg w-100 py-3 fw-bold mb-3" onclick="checkout()">
                        Checkout Now <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>
                    <a href="index.html" class="btn btn-outline-secondary w-100 py-2 border-0 fw-semibold">
                        <i class="fa-solid fa-chevron-left me-2"></i> Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/cart.js"></script>
</body>
</html>
