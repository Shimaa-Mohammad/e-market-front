<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
   <!-- bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- google awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <!-- style css -->
  <link rel="stylesheet" href="main.css">
  <!-- swiper css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!--google fonts-->
 <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fredoka:wght@300..700&family=REM:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
   
        
          
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">My Store</a>
            <div class="text-white">
                <i class="fas fa-shopping-cart"></i> 
            </div>
        </div>
    </nav>

<div class="container">
    <div class="row login-container g-0 flex-row-reverse">
        
        <div class="col-md-6 d-none d-md-block">
            <img src="assets/Email campaign-bro (1).png" alt="Login Image" class="img-side" style="width: 100%; height: 100%; object-fit: cover;">
        </div>

        <div class="col-md-6">
            <div class="form-side">
                <div class="text-center mb-5">
                    <h2 class="fw-bold">مرحباً بعودتك!</h2>
                    <p class="text-muted">الرجاء إدخال بياناتك لتسجيل الدخول</p>
                </div>

                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label">البريد الإلكتروني</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label class="form-label">كلمة المرور</label>
                            <a href="#" class="text-decoration-none small text-primary">نسيت كلمة المرور؟</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="password" class="form-control" placeholder="********" required>
                        </div>
                    </div>

                    <div id="login-error" class="alert alert-danger" style="display: none; padding: 10px; font-size: 14px;"></div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">تذكرني على هذا الجهاز</label>
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" class="btn button btn-lg fw-bold">تسجيل الدخول</button>
                    </div>

                    <div class="text-center">
                        <p class="mb-0">ليس لديك حساب؟ 
                            <a href="singup.html" class="text-primary fw-bold text-decoration-none">إنشاء حساب جديد</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- bootstrap js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
    <script src="./js/login.js"></script>
</body>
</html>
